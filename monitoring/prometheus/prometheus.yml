# Scrapes HookRelay's two kinds of process on the Compose network.
global:
  # Short interval so the dashboard reacts within seconds during demos and
  # load tests. 15s or more is plenty in production.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # The API merges its uvicorn processes into one /metrics response.
  - job_name: hookrelay-api
    static_configs:
      - targets: ["api:8000"]

  # One target per worker container: Docker's DNS returns every replica of
  # the "worker" service, so `--scale worker=N` is picked up automatically.
  - job_name: hookrelay-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s

# Development overrides. Applied automatically by `docker compose up`.
# Ignored in production via: `docker compose -f docker-compose.yml up`.

services:
  api:
    environment:
      # --reload runs a single process; WEB_CONCURRENCY only applies without it.
      WEB_CONCURRENCY: 1
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  worker:
    ports:
      - "9100:9100"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
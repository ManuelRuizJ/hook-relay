# Development overrides. Applied automatically by `docker compose up`.
# Ignored in production via: `docker compose -f docker-compose.yml up`.

services:
  api:
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./alembic:/app/alembic
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  worker:
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
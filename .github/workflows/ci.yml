name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: hookrelay_ci_pw
          POSTGRES_DB: hookrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hookrelay -d hookrelay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Same variables as .env, pointed at the service containers. The
    # password only exists inside this ephemeral job, so it is not a secret.
    env:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay_ci_pw
      POSTGRES_DB: hookrelay
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same script Docker Compose mounts into /docker-entrypoint-initdb.d.
      - name: Create test database
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: >-
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          -v ON_ERROR_STOP=1 -f docker/initdb/01-create-test-db.sql

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models and migrations are in sync
        run: alembic check

      - name: Run tests
        run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag hookrelay:ci .
